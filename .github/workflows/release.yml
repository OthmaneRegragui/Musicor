name: Release

# Releases the three distributable artifacts:
#   - Android APK
#   - Linux AppImage (single file)
#   - Windows portable EXE (single file)
#
# Pushing a v* tag builds all three and publishes them as a GitHub Release.
# workflow_dispatch runs the same builds without publishing, which is handy for
# checking the artifacts before tagging. Continuous builds (PRs, pushes to main)
# are covered by build.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # Optional release signing. Set these repository secrets to sign the
      # release APK with a real keystore; without them the APK falls back to
      # the debug key (see androidApp/build.gradle.kts).
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure release signing (optional)
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/musicor.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/musicor.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*release*.apk \
            "dist/musicor-${{ steps.version.outputs.value }}-android.apk"
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicor-android
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # No Android SDK setup here: GitHub-hosted runners ship one, and
      # :shared declares an Android target, so configuration already needs it.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build app image
        # createDistributable runs `jpackage --type app-image`, which yields the
        # portable directory that gets turned into an AppImage below. Compose's
        # own packageAppImage is deliberately skipped: it only shells out to
        # appimagetool if it happens to be on PATH.
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: Download appimagetool
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl -fL --http1.1 --retry 3 -o build/tools/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/tools/appimagetool

      - name: Assemble AppDir and build AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          app_image="desktopApp/build/compose/binaries/main/app/com.regtho.musicor"
          if [ ! -d "$app_image" ]; then
            echo "::error::app image not found at $app_image"
            exit 1
          fi

          # appimagetool needs a self-contained AppDir: the app image plus a
          # desktop entry, an icon and an AppRun launcher script.
          stage="$PWD/build/appimage-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -r "$app_image"/. "$stage"/
          cp media/logo.png "$stage/musicor.png"
          ln -sf musicor.png "$stage/.DirIcon"
          printf '[Desktop Entry]\nName=Musicor\nComment=Local music player\nExec=bin/com.regtho.musicor\nIcon=musicor\nType=Application\nCategories=AudioVideo;Audio;Player;\nTerminal=false\n' \
            > "$stage/musicor.desktop"
          printf '#!/bin/sh\nSELF="$(readlink -f "$0")"\nHERE="$(dirname "$SELF")"\nexec "$HERE/bin/com.regtho.musicor" "$@"\n' \
            > "$stage/AppRun"
          chmod +x "$stage/AppRun"

          mkdir -p dist
          # APPIMAGE_EXTRACT_AND_RUN: CI runners have no FUSE. NO_STRIP: the
          # bundled runtime is already stripped.
          APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 \
            ./build/tools/appimagetool --appimage-extract-and-run -n "$stage" \
            "$PWD/dist/musicor-$VERSION-linux-x86_64.AppImage"
          ls -lh dist/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: musicor-linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows portable EXE
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, so the same shell syntax works in every job.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build app image
        shell: pwsh
        run: .\gradlew.bat :desktopApp:createDistributable --no-daemon

      - name: Build portable single-file EXE
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          app_image="$GITHUB_WORKSPACE/desktopApp/build/compose/binaries/main/app/com.regtho.musicor"
          if [ ! -d "$app_image" ]; then
            echo "::error::app image not found at $app_image"
            exit 1
          fi

          # jpackage puts a single <packageName>.exe in the app-image root; the
          # launcher is auto-detected from there by tools/portable-sfx.
          launchers=$(cd "$app_image" && ls -1 *.exe 2>/dev/null | tr '\n' ' ' || true)
          if [ -z "$launchers" ]; then
            echo "::error::no launcher .exe in the app image root"
            exit 1
          fi
          echo "Launcher(s): $launchers"

          # Compose cannot emit a portable .exe, only an installer, so the app
          # image is zipped and embedded into a self-extracting executable. -mx=1
          # keeps the one-off unpacking on first run quick. cygpath hands the
          # native tools (7z, go) paths they can actually resolve.
          payload_zip=$(cygpath -w "$GITHUB_WORKSPACE/tools/portable-sfx/payload.zip")
          cd "$app_image"
          7z a -tzip -mx=1 "$payload_zip" ./*

          # Key the unpack cache on the payload itself, so a new release can
          # never reuse the directory unpacked by an older one.
          payload_id=$(sha256sum "$GITHUB_WORKSPACE/tools/portable-sfx/payload.zip" | cut -c1-16)

          cd "$GITHUB_WORKSPACE/tools/portable-sfx"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # -H windowsgui: a console subsystem build would leave a console
          # window open next to the player for as long as it runs.
          go build -ldflags "-H windowsgui -X main.payloadID=$payload_id" \
            -o "$(cygpath -w "$GITHUB_WORKSPACE/dist/musicor-$VERSION-windows-x64.exe")" .
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: musicor-windows
          path: dist/
          if-no-files-found: error

  # Publishes the collected artifacts as a GitHub Release. Only runs for tags;
  # a manual dispatch stops after uploading the workflow artifacts.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            | Artifact | Platform | Notes |
            | --- | --- | --- |
            | `musicor-*-android.apk` | Android 6.0+ | Install directly; allow unknown sources. |
            | `musicor-*-linux-x86_64.AppImage` | Linux x86_64 | Make executable, then run it. |
            | `musicor-*-windows-x64.exe` | Windows x86/64 | Portable: no install, just run it. |
