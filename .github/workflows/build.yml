name: Build

# CI only: verifies every platform still builds on PRs and pushes to main.
# Releases are published by release.yml, which is the single publisher for
# v* tags - keeping tag publishing here too would make two workflows race to
# create the same GitHub Release and upload conflicting artifact names.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # Optional release signing. Set these repository secrets to sign the
      # release APK with a real keystore; without them the APK falls back to
      # the debug key (see androidApp/build.gradle.kts).
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure release signing (optional)
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/musicor.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/musicor.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release and debug APKs
        run: ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*release*.apk dist/musicor-android.apk
          cp androidApp/build/outputs/apk/debug/*debug*.apk dist/musicor-android-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: musicor-android
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux (AppImage + deb + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Linux packages
        run: ./gradlew --continue :desktopApp:packageAppImage :desktopApp:packageDeb --no-daemon

      - name: Archive portable app image
        # packageAppImage produces an app-image directory; package it into a
        # single distributable archive.
        run: tar -czf musicor-linux-amd64.tar.gz -C desktopApp/build/compose/binaries/main/app .

      - name: Build AppImage
        # Convert the app-image directory into a real single-file AppImage.
        run: |
          set -e
          curl -fL --http1.1 --retry 3 -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          STAGE="$PWD/build/appimage-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r desktopApp/build/compose/binaries/main/app/com.regtho.musicor/. "$STAGE"/
          cp media/logo.png "$STAGE/musicor.png"
          ln -s musicor.png "$STAGE/.DirIcon"
          printf '[Desktop Entry]\nName=Musicor\nComment=Local music player\nExec=bin/com.regtho.musicor\nIcon=musicor\nType=Application\nCategories=AudioVideo;Audio;Player;\nTerminal=false\n' \
            > "$STAGE/musicor.desktop"
          printf '#!/bin/sh\nSELF="$(readlink -f "$0")"\nHERE="$(dirname "$SELF")"\nexec "$HERE/bin/com.regtho.musicor" "$@"\n' \
            > "$STAGE/AppRun"
          chmod +x "$STAGE/AppRun"
          APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 \
            /tmp/appimagetool --appimage-extract-and-run -n "$STAGE" "$PWD/musicor-linux-amd64.AppImage"

      - name: Collect Linux packages
        run: |
          mkdir -p dist
          cp musicor-linux-amd64.AppImage dist/
          cp musicor-linux-amd64.tar.gz dist/
          cp desktopApp/build/compose/binaries/main/deb/*.deb dist/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: musicor-linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build EXE
        run: .\gradlew.bat :desktopApp:packageExe --no-daemon

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe dist/

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: musicor-windows
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build dmg
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      - name: Collect dmg
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg dist/

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: musicor-macos
          path: dist/
          if-no-files-found: error
